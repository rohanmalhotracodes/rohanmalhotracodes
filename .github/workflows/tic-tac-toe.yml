name: Tic Tac Toe

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  play:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'tictactoe:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Play move
        env:
          ISSUE_TITLE: ${{ github.event.issue.title || 'tictactoe:reset' }}
        run: python game/play.py
      - name: Commit updated board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/state.json assets/tic-tac-toe.svg
          git diff --cached --quiet || git commit -m "Update Tic-Tac-Toe board"
          git push
      - name: Close move issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Move played — refresh the profile to see the board."
